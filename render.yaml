services:
  - type: web
    name: prana-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_MEDICAL_REPORTS_BUCKET
        value: medical-reports
      - key: CORS_ORIGINS
        sync: false
      - key: PRANA_DEMO_OCR
        value: "false"
